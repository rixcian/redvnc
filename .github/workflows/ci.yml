name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install X11 headers and x264
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libx264-dev

      - name: Install x264 (macOS)
        if: runner.os == 'macOS'
        run: brew install x264

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test (no race - CGO unavailable)
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  linux-wayland:
    name: Build with wayland tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install X11, PipeWire and x264 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libx264-dev pkg-config

      - name: Build (wayland tag)
        run: go build -tags wayland ./...

      - name: Vet (wayland tag)
        run: go vet -tags wayland ./...

      - name: Test (wayland tag)
        run: go test -tags wayland ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
